[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mountainash-auth-openai"
dynamic = ["version"]
description = "OpenAI's sign-in rules over mountainash-auth-client: Sign in with ChatGPT, a shared account store, and the subscription route's facts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
keywords = ["authentication", "oauth", "oauth2", "openai", "chatgpt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mountainash-auth-client",
    "mountainash-settings>=0.1.0,<0.2",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic>=2.9",
]

[project.scripts]
mountainash-auth-openai = "mountainash_auth_openai.cli:main"

[project.urls]
Source = "https://github.com/mountainash-io/mountainash-auth-openai"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

# Side-by-side checkouts until compatible packages are published (as mountainash-auth-client's README does).
[tool.uv.sources]
mountainash-auth-client = { path = "../mountainash-auth-client", editable = true }
mountainash-settings = { path = "../mountainash-settings", editable = true }

[tool.hatch.version]
path = "src/mountainash_auth_openai/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mountainash_auth_openai"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "FA", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
